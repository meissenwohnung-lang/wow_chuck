<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#27456e"/>
      <stop offset="0.55" stop-color="#14233b"/>
      <stop offset="1" stop-color="#070b13"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.45" stop-color="#e0b24a"/>
      <stop offset="1" stop-color="#8a5f17"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a3a"/>
      <stop offset="1" stop-color="#6e4710"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#7fc4ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7fc4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="36" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="28" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#e0b24a" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Eckzierden -->
  <g stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M24 70 V24 H70"/><path d="M442 24 H488 V70"/>
    <path d="M24 442 V488 H70"/><path d="M442 488 H488 V442"/>
  </g>

  <!-- Leuchten -->
  <circle cx="256" cy="226" r="190" fill="url(#glow)"/>

  <!-- Blitze -->
  <g fill="#9fd4ff" opacity="0.9">
    <path d="M92 150 L128 150 L108 192 L134 192 L88 262 L102 206 L78 206 Z"/>
    <path d="M420 150 L384 150 L404 192 L378 192 L424 262 L410 206 L434 206 Z"/>
  </g>

  <!-- Faust -->
  <g filter="url(#shadow)">
    <!-- Handgelenk / Manschette -->
    <rect x="186" y="318" width="140" height="48" rx="8" fill="url(#goldDark)" stroke="#5a3a0c" stroke-width="3"/>
    <rect x="186" y="318" width="140" height="12" rx="6" fill="#f3d37a" opacity="0.7"/>
    <!-- Handrücken -->
    <path d="M176 196 Q176 176 196 176 H316 Q336 176 336 196 V300 Q336 322 314 322 H198 Q176 322 176 300 Z"
          fill="url(#gold)" stroke="#5a3a0c" stroke-width="4"/>
    <!-- vier Finger (Knöchel) -->
    <g fill="url(#gold)" stroke="#5a3a0c" stroke-width="4">
      <rect x="176" y="132" width="40" height="86" rx="20"/>
      <rect x="215" y="120" width="40" height="98" rx="20"/>
      <rect x="254" y="120" width="40" height="98" rx="20"/>
      <rect x="293" y="132" width="40" height="86" rx="20"/>
    </g>
    <!-- Fingerglieder -->
    <g stroke="#5a3a0c" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M182 194 H210"/><path d="M221 190 H249"/><path d="M260 190 H288"/><path d="M299 194 H327"/>
    </g>
    <!-- Daumen -->
    <path d="M168 230 Q132 232 134 262 Q136 292 176 290 L244 288 Q262 280 252 262 Q244 250 226 252 L176 256 Z"
          fill="url(#gold)" stroke="#5a3a0c" stroke-width="4"/>
    <!-- Glanzlichter -->
    <g fill="#fff6c8" opacity="0.55">
      <ellipse cx="195" cy="148" rx="7" ry="22"/><ellipse cx="234" cy="138" rx="7" ry="24"/>
      <ellipse cx="273" cy="138" rx="7" ry="24"/><ellipse cx="312" cy="148" rx="7" ry="22"/>
    </g>
  </g>

  <!-- Titelband -->
  <g>
    <rect x="52" y="388" width="408" height="84" rx="10" fill="#0a111d" stroke="url(#gold)" stroke-width="4"/>
    <text x="256" y="428" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="36" fill="url(#gold)" stroke="#3a2406" stroke-width="1.2" letter-spacing="2">CHUCK NORRIS</text>
    <text x="256" y="458" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="25" fill="#cfe6ff" letter-spacing="9">FACTS</text>
  </g>
</svg>
